<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Финансы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>💰 Мой Кошелек</h1>
            <div class="balance-card">
                <div>
                    <span class="balance-label">Свободные деньги</span>
                    <span id="total-balance">0 ₽</span>
                </div>
                <div class="balance-sub">
                    <span id="in-envelopes">В конвертах: 0 ₽</span><br>
                    <span id="in-goals">В целях: 0 ₽</span>
                </div>
            </div>
        </header>

        <!-- ДОХОД И РАСХОД -->
        <section class="input-forms">
            <div class="form-card income-form">
                <h3>💵 Доход</h3>
                <form id="income-form">
                    <input type="number" id="income-amount" placeholder="Сумма" required min="0.01" step="0.01">
                    <input type="text" id="income-desc" placeholder="Откуда (зарплата, подработка)" required>
                    <button type="submit">Добавить доход</button>
                </form>
            </div>

            <div class="form-card expense-form">
                <h3>💸 Расход</h3>
                <form id="expense-form">
                    <input type="number" id="expense-amount" placeholder="Сумма" required min="0.01" step="0.01">
                    <input type="text" id="expense-desc" placeholder="На что (сиги, еда)" required>
                    <button type="submit">Добавить расход</button>
                </form>
            </div>
        </section>

        <!-- ЦЕЛИ -->
        <section class="section-block">
            <h2>🎯 Цели (накопления)</h2>
            <div class="form-card">
                <form id="goal-form" class="inline-form">
                    <input type="text" id="goal-name" placeholder="На что копим (машина, телефон)" required>
                    <input type="number" id="goal-target" placeholder="Нужная сумма" required min="1" step="0.01">
                    <button type="submit">Создать цель</button>
                </form>
            </div>
            <div id="goals-list"></div>
        </section>

        <!-- КОНВЕРТЫ -->
        <section class="section-block">
            <h2>📁 Выделенная сумма на период</h2>
            <div class="form-card">
                <form id="envelope-form">
                    <div class="env-main-fields">
                        <input type="text" id="env-name" placeholder="Название (Продукты)" required>
                        <input type="number" id="env-limit" placeholder="Сумма на период" required min="1" step="0.01">
                        <label class="date-label">С:
                            <input type="date" id="env-date-from" required>
                        </label>
                        <label class="date-label">По:
                            <input type="date" id="env-date-to" required>
                        </label>
                    </div>

                    <div class="reserves-block">
                        <div class="reserves-title">🔒 Обязательные резервы (сколько должно остаться)</div>
                        <div id="reserves-form-list"></div>
                        <button type="button" class="btn-add-reserve" onclick="addReserveRow()">+ Добавить резерв</button>
                    </div>

                    <button type="submit" class="btn-create-env">Создать конверт</button>
                </form>
            </div>
            <div id="envelopes-list"></div>
        </section>

        <!-- ИСТОРИЯ -->
        <section class="history-section">
            <h2>📜 История операций</h2>
            <div id="transactions-list"></div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
