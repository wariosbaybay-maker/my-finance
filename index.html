<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Финансы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Шапка с балансом -->
        <header>
            <h1>💰 Мой Кошелек</h1>
            <div class="balance-card">
                <span>Текущий баланс</span>
                <span id="total-balance">0 ₽</span>
            </div>
        </header>

        <!-- Формы ввода -->
        <section class="input-forms">
            <!-- Добавить доход -->
            <div class="form-card income-form">
                <h3>Добавить доход</h3>
                <form id="income-form">
                    <input type="number" id="income-amount" placeholder="Сумма" required min="0.01" step="0.01">
                    <input type="text" id="income-desc" placeholder="Описание (зарплата, подработка)" required>
                    <button type="submit">Добавить</button>
                </form>
            </div>

            <!-- Добавить расход -->
            <div class="form-card expense-form">
                <h3>Добавить расход</h3>
                <form id="expense-form">
                    <input type="number" id="expense-amount" placeholder="Сумма" required min="0.01" step="0.01">
                    <input type="text" id="expense-desc" placeholder="На что (еда, транспорт)" required>
                    <button type="submit">Добавить</button>
                </form>
            </div>

            <!-- Создать цель (отложить) -->
            <div class="form-card goal-form">
                <h3>🎯 Создать цель</h3>
                <form id="goal-form">
                    <input type="text" id="goal-name" placeholder="Название (на машину)" required>
                    <input type="number" id="goal-target" placeholder="Нужная сумма" required min="1" step="0.01">
                    <button type="submit">Создать</button>
                </form>
            </div>
        </section>

        <!-- Список целей -->
        <section id="goals-list-section">
            <h2>Мои цели</h2>
            <div id="goals-list"></div>
        </section>

        <!-- История операций -->
        <section class="history-section">
            <h2>История</h2>
            <div id="transactions-list"></div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
