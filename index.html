<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Финансы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>💰 Мой Кошелек</h1>

            <div class="toolbar">
                <button type="button" class="tool-btn" onclick="downloadBackup()">💾 Скачать бэкап</button>
                <button type="button" class="tool-btn" onclick="document.getElementById('upload-input').click()">📂 Загрузить бэкап</button>
                <button type="button" class="tool-btn" onclick="showVersionHistory()">🕐 История версий</button>
                <button type="button" class="tool-btn" onclick="showCategoriesManager()">⚙️ Категории</button>
                <input type="file" id="upload-input" accept=".json" style="display:none" onchange="uploadBackup(event)">
            </div>

            <div class="balance-card">
                <div>
                    <span class="balance-label">Свободные деньги</span>
                    <span id="total-balance">0 ₽</span>
                </div>
                <div class="balance-sub">
                    <span id="in-envelopes">В конвертах: 0 ₽</span><br>
                    <span id="in-goals">В целях: 0 ₽</span><br>
                    <span id="in-reserves">В резервах: 0 ₽</span>
                </div>
            </div>
        </header>

        <section class="input-forms">
            <div class="form-card income-form">
                <h3>💵 Доход</h3>
                <form id="income-form">
                    <input type="number" id="income-amount" placeholder="Сумма" required min="0.01" step="0.01">
                    <select id="income-category" required></select>
                    <input type="text" id="income-desc" placeholder="Откуда (зарплата, подработка)" required>
                    <button type="submit">Добавить доход</button>
                </form>
            </div>

            <div class="form-card expense-form">
                <h3>💸 Расход</h3>
                <form id="expense-form">
                    <input type="number" id="expense-amount" placeholder="Сумма" required min="0.01" step="0.01">
                    <select id="expense-category" required></select>
                    <input type="text" id="expense-desc" placeholder="На что (сиги, еда)" required>
                    <button type="submit">Добавить расход</button>
                </form>
            </div>
        </section>

        <section class="section-block">
            <h2>🔒 Обязательные резервы</h2>
            <div class="form-card">
                <form id="reserve-form" class="reserve-form-grid">
                    <input type="text" id="reserve-name" placeholder="На что (на сиги, на проезд)" required>
                    <input type="number" id="reserve-amount" placeholder="Сумма" required min="1" step="0.01">
                    <label class="date-label">С:
                        <input type="date" id="reserve-date-from" required>
                    </label>
                    <label class="date-label">По:
                        <input type="date" id="reserve-date-to" required>
                    </label>
                    <button type="submit">Создать резерв</button>
                </form>
            </div>
            <div id="reserves-list"></div>
        </section>

        <section class="section-block">
            <h2>🎯 Цели (накопления)</h2>
            <div class="form-card">
                <form id="goal-form" class="inline-form">
                    <input type="text" id="goal-name" placeholder="На что копим (машина, телефон)" required>
                    <input type="number" id="goal-target" placeholder="Нужная сумма" required min="1" step="0.01">
                    <button type="submit">Создать цель</button>
                </form>
            </div>
            <div id="goals-list"></div>
        </section>

        <section class="section-block">
            <h2>📁 Выделенная сумма на период</h2>
            <div class="form-card">
                <form id="envelope-form" class="envelope-form-grid">
                    <input type="text" id="env-name" placeholder="Название (Продукты)" required>
                    <input type="number" id="env-limit" placeholder="Сумма на период" required min="1" step="0.01">
                    <label class="date-label">С:
                        <input type="date" id="env-date-from" required>
                    </label>
                    <label class="date-label">По:
                        <input type="date" id="env-date-to" required>
                    </label>
                    <button type="submit">Создать конверт</button>
                </form>
            </div>
            <div id="envelopes-list"></div>
        </section>

        <section class="history-section">
            <h2>📜 История операций</h2>
            <div id="transactions-list"></div>
        </section>
    </div>

    <!-- Модалка истории версий -->
    <div id="version-modal" class="modal-overlay" style="display:none">
        <div class="modal">
            <div class="modal-header">
                <h3>🕐 История версий</h3>
                <button class="modal-close" onclick="closeVersionHistory()">×</button>
            </div>
            <div id="version-list" class="modal-body"></div>
        </div>
    </div>

    <!-- Модалка категорий -->
    <div id="categories-modal" class="modal-overlay" style="display:none">
        <div class="modal">
            <div class="modal-header">
                <h3>⚙️ Управление категориями</h3>
                <button class="modal-close" onclick="closeCategoriesManager()">×</button>
            </div>
            <div class="modal-body">
                <div class="cat-tabs">
                    <button class="cat-tab active" onclick="switchCatTab('expense')" id="tab-expense">💸 Расходы</button>
                    <button class="cat-tab" onclick="switchCatTab('income')" id="tab-income">💵 Доходы</button>
                </div>

                <div id="categories-list-expense" class="categories-list"></div>
                <div id="categories-list-income" class="categories-list" style="display:none"></div>

                <div class="cat-add-block">
                    <h4>➕ Добавить категорию</h4>
                    <div class="cat-add-grid">
                        <input type="text" id="cat-new-icon" placeholder="😀" maxlength="4">
                        <input type="text" id="cat-new-name" placeholder="Название">
                        <input type="color" id="cat-new-color" value="#3498db">
                        <button onclick="addCategoryFromForm()">Добавить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
