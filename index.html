<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Финансы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>💰 Мой Кошелек</h1>
            <div class="balance-card">
                <div>
                    <span class="balance-label">Свободные деньги</span>
                    <span id="total-balance">0 ₽</span>
                </div>
                <div class="balance-sub">
                    <span id="in-envelopes">В конвертах: 0 ₽</span>
                </div>
            </div>
        </header>

        <!-- Доход -->
        <section class="input-forms">
            <div class="form-card income-form">
                <h3>Добавить доход</h3>
                <form id="income-form">
                    <input type="number" id="income-amount" placeholder="Сумма" required min="0.01" step="0.01">
                    <input type="text" id="income-desc" placeholder="Описание (зарплата, подработка)" required>
                    <button type="submit">Добавить</button>
                </form>
            </div>

            <div class="form-card envelope-form">
                <h3>📁 Создать конверт</h3>
                <form id="envelope-form">
                    <input type="text" id="env-name" placeholder="Название (Продукты)" required>
                    <input type="number" id="env-limit" placeholder="Сумма на период" required min="1" step="0.01">
                    <button type="submit">Создать конверт</button>
                </form>
            </div>
        </section>

        <!-- Конверты -->
        <section id="envelopes-section">
            <h2>Мои конверты</h2>
            <div id="envelopes-list"></div>
        </section>

        <!-- История -->
        <section class="history-section">
            <h2>История операций</h2>
            <div id="transactions-list"></div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
